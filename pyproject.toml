[project]
name = "facecast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "lpips>=0.1.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
]

# RTX 50-series needs the CUDA 12.8 build of PyTorch
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

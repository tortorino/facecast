[project]
name = "facecast"
version = "0.1.0"
description = "Face super-resolution (16x16 -> 128x128) with generators trained on CelebA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "safetensors>=0.4",
    "torch>=2.1",
]

[project.scripts]
facecast = "facecast.cli:main"

# Only needed for the notebook (training and evaluation) and the tests
[dependency-groups]
dev = [
    "datasets>=5.2.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "lpips>=0.1.4",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pytest>=8.0",
    "scikit-image>=0.26.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# RTX 50-series needs the CUDA 12.8 build of PyTorch
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
